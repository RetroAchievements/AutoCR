name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow a manual redeploy without needing to make a code change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # required for deploy to auth to Pages via OIDC

concurrency:
  group: pages
  cancel-in-progress: false # leaving unfinished runs stranded can cause deployment issues

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
